<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ profile.name }} | Portfolio</title>
</head>
<body>
    <main>
        <h1>{{ profile.name }}</h1>
        <p>{{ profile.role }}</p>
        <p>{{ profile.summary }}</p>

        <section>
            <h2>Habilidades</h2>
            <ul>
                {% for skill in skills %}
                    <li>{{ skill }}</li>
                {% endfor %}
            </ul>
        </section>

        <section>
            <h2>Projetos</h2>
            {% for project in projects %}
                <article>
                    <h3>{{ project.title }}</h3>
                    <p>{{ project.description }}</p>
                </article>
            {% endfor %}
        </section>

        <section>
            <h2>Contato</h2>
            <p>{{ contact.email }}</p>
            <p><a href="{{ contact.github }}">GitHub</a></p>
            <p><a href="{{ contact.linkedin }}">LinkedIn</a></p>
        </section>
    </main>
</body>
</html>
